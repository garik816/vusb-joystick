name: Build Freedom USB Gamepad - local Windows
on:
  push:
    branches: ["feat/hid-gamepad-ps3-generic"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vusb-local-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 35
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Check HID descriptor and joystick unit tests
        run: ./scripts/ci-windows-avr.ps1 -Phase test

      - name: Reuse existing Arduino CLI and AVR cores
        run: ./scripts/ci-windows-avr.ps1 -Phase setup

      - name: Compile ATmega8 and ATmega328P
        run: ./scripts/ci-windows-avr.ps1 -Phase build

      - name: Publish HEX and checksums
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: FreedomUSB-v2.0.0-${{ github.run_number }}-Windows
          path: |
            dist/**/*.hex
            dist/**/*.elf
            dist/**/*.eep
            dist/**/BUILD_INFO.txt
          if-no-files-found: warn
          retention-days: 30
